<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>

    <!-- Browser Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/ml.svg' | relative_url }}">

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            color: white;
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        moonlite: {
                            accent: '{{ site.theme_accent | default: "#F47B49" }}',
                            accentHover: '#E06838',
                            main: '#1a1a1a',
                            card: '#2A2A2A',
                            cardHover: '#333333',
                            border: '#333333',
                            muted: '#AAAAAA'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex flex-col items-center py-16 px-6">

    <div class="w-full max-w-2xl flex flex-col">

        <!-- Persistent Header -->
        <div class="text-left mb-10">
            <div class="flex items-center mb-3">
                <!-- SVG Icon loaded as a CSS mask to dynamically apply the accent color -->
                <div class="w-10 h-10 mr-4 shrink-0 bg-moonlite-accent"
                     style="-webkit-mask: url('{{ '/assets/images/ml.svg' | relative_url }}') no-repeat center; mask: url('{{ '/assets/images/ml.svg' | relative_url }}') no-repeat center; -webkit-mask-size: contain; mask-size: contain;">
                </div>
                <h1 class="text-4xl font-bold tracking-wide">{{ site.title }}</h1>
            </div>
            <p class="text-moonlite-muted text-lg">{{ site.description }}</p>
        </div>

        <!-- Persistent Call to Action: newest installer in /updates/ -->
        {% include latest_exe.html %}
        {% if latest_exe_path != "" %}
        <div class="flex justify-start mb-14">
            <a href="{{ latest_exe_path | relative_url }}"
               download="MoonLite-Setup-{{ latest_exe_version }}.exe"
               class="bg-moonlite-accent hover:bg-moonlite-accentHover text-white px-6 py-2.5 rounded-full font-bold text-sm uppercase tracking-wide flex items-center shadow-lg transition-colors active:scale-[0.99]">
                <img src="{{ '/assets/images/exe-icon.png' | relative_url }}" alt="Download" class="w-5 h-5 mr-3 object-contain">
                Download Latest
            </a>
        </div>
        {% endif %}

        <!-- Dynamic Page Content -->
        {{ content }}

        <!-- Persistent Footer -->
        <div class="mt-12 text-left text-moonlite-muted text-sm space-y-1">
            <p>{{ site.title }} is maintained by {{ site.github_username }}.</p>
            <p>This page was generated by GitHub Pages.</p>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
