<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>

    <!-- Tailwind and Lucide Setup -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            color: white;
        }
    </style>

    <!-- Dynamic Theme Configuration injected via Jekyll -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        moonlite: {
                            accent: '{{ site.theme_accent | default: "#F47B49" }}',
                            accentHover: '#E06838',
                            main: '#1a1a1a',
                            card: '#2A2A2A',
                            cardHover: '#333333',
                            border: '#333333',
                            muted: '#AAAAAA'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex flex-col items-center py-16 px-6">

    <div class="w-full max-w-2xl flex flex-col">
        <!-- Injects content from index.html or other pages -->
        {{ content }}

        <!-- Footer -->
        <div class="mt-12 text-center text-moonlite-muted text-sm space-y-1">
            <p>{{ site.title }} is maintained by {{ site.github_username }}.</p>
            <p>This page was generated by GitHub Pages.</p>
        </div>
    </div>

    <!-- Initialize Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
